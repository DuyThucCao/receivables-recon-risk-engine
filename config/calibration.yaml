# Generator calibration for the synthetic raw documents.
#
# Every entry has: value, source_class, source, retrieved.
# source_class is one of the five data labels (DESIGN.md section 8):
#   observed_public | published_aggregate | synthetic_record | financial_assumption | model_estimate
#
# Most values below are assumptions chosen so that the simulated hospital behaves plausibly.
# They are NOT measurements. When config/public_calibration.yaml exists, the loader
# (src/recon_engine/datagen/calibration.py) overrides three groups with public figures and
# records each override in data/raw/generation_metadata.json and results/core_build.json:
#   1. denial.first_pass_denial_rate  <- CMS Transparency in Coverage percentiles, read at
#      the percentile position given in denial.denial_rate_percentile;
#   2. drugs.reference_list           <- CMS Part B payment limits (drug_reference_prices.drugs);
#   3. financial_assumptions.discount_rate <- SOFR (interest_rates.sofr.value_pct).
# Payers, hospital, bank and wholesaler are fictional. No real patient data is used.

